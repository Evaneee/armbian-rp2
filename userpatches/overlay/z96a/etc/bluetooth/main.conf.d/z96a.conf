# Z96A RTL8821CS — pairing policy
# Firmware cannot keep SSP across power-on (hci 0x0c7a). LE uses SMP/Just Works.
# JustWorksRepairing helps LE re-pair without UI PIN prompts.

[General]
ControllerMode = dual
JustWorksRepairing = always
FastConnectable = true
# Power is owned by /etc/z96a/z96a-bt (ssp-safe bring-up); keep AutoEnable off.
AutoEnable = false

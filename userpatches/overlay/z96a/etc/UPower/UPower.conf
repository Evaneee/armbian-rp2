[UPower]
# Z96A battery is OCV/ADC-only (no fuel-gauge current). Capacity noise used to
# invent huge Wh rates and trip GNOME critical power-off (~60s) on plug/unplug.
# Keep percentage warnings; do not auto sleep/power-off from this crude gauge.
CriticalPowerAction=Ignore
UsePercentageForPolicy=true
PercentageLow=15
PercentageCritical=8
PercentageAction=3

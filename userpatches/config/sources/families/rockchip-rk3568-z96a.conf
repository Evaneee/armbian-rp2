#
# Z96A laptop (RK3568) — board-private family kept under userpatches.
# Upstream rk35xx dropped the 5.10 "legacy" branch; this family preserves
# the working Z96A stack: radxa u-boot 4.19-rock3 + linux-rockchip rk-5.10-rkr6.
#
# shellcheck source=/dev/null
source "${SRC}/config/sources/families/include/rockchip64_common.inc"

BOOTSOURCE='https://github.com/radxa/u-boot.git'
BOOTBRANCH='branch:stable-4.19-rock3'
BOOTPATCHDIR="legacy"
OVERLAY_PREFIX='rk3568-z96a'

case $BRANCH in

	legacy)
		UBOOT_COMPILER="aarch64-linux-gnu-"
		UBOOT_USE_GCC='< 8.0'
		BOOTDIR='u-boot-rockchip64'
		KERNELSOURCE='https://github.com/armbian/linux-rockchip.git'
		KERNELBRANCH='branch:rk-5.10-rkr6'
		declare -g -i KERNEL_GIT_CACHE_TTL=120
		declare -g KERNEL_MAJOR_MINOR="5.10"
		KERNELPATCHDIR='rockchip-rk3568-z96a/legacy'
		;;

esac

prepare_boot_configuration

family_tweaks_bsp() {
	:
}

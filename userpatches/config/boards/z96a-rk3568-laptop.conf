# Rockchip RK3568 laptop — Z96A
# Latest Armbian (rk35xx vendor 6.1) + mainline U-Boot v2026.07 + mainline TF-A.
# DDR must stay on v1.13 (v1.21 bricks this LPDDR4X board).
# PMIC is RK817 (Rock 3A DTS is RK809) — generated as rk3568-z96a.dts at build time.
BOARD_NAME="z96a"
BOARD_VENDOR="z96a"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="Evan"
INTRODUCED="2024"
BOOTCONFIG="rock-3a-rk3568_defconfig"
KERNEL_TARGET="vendor,current,edge"
KERNEL_TEST_TARGET="vendor,current,edge"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3568-z96a.dtb"
# Mainline TF-A (open BL31) + Rockchip DDR blob; see uboot.inc for DDR pin.
BOOT_SCENARIO="binman-atf-mainline"
IMAGE_PARTITION_TABLE="gpt"
BOOTFS_TYPE="fat"

# Debug UART: mainline-style ttyS2 (fiq-debugger disabled in DTS)
SERIALCON="ttyS2"

# GPU: Mali-G52 via open Panfrost KMD + Mesa userspace (same stack as Rock 3A mainline/desktop).
# Mesa itself is installed by armbian-config module_desktops at DESKTOP_TIER=mid|full (default mid).
# Do NOT pass ENABLE_EXTENSIONS=mesa-vpu — that extension was removed upstream.

# Mainline U-Boot for all branches (including vendor kernel) — always built from source.

# Board hooks: common/ (uboot gnome bluetooth sound) + current + edge + vendor
# shellcheck source=/dev/null
declare -g Z96A_BOARD_INC_DIR="${BASH_SOURCE[0]%/*}/z96a-rk3568-laptop"
source "${Z96A_BOARD_INC_DIR}/common/common.inc"
source "${Z96A_BOARD_INC_DIR}/current.inc"
source "${Z96A_BOARD_INC_DIR}/edge.inc"
source "${Z96A_BOARD_INC_DIR}/vendor.inc"

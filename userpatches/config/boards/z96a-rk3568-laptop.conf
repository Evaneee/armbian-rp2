# Rockchip RK3568 laptop — Z96A
# Latest Armbian (rk35xx vendor 6.1) + mainline U-Boot v2026.04.
# DDR must stay on v1.13 (v1.21 bricks this LPDDR4X board).
# PMIC is RK817 (Rock 3A DTS is RK809) — generated as rk3568-z96a.dts at build time.
BOARD_NAME="z96a"
BOARD_VENDOR="z96a"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="Evan"
INTRODUCED="2024"
BOOTCONFIG="rock-3a-rk3568_defconfig"
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3568-z96a.dtb"
BOOT_SCENARIO="spl-blobs"
IMAGE_PARTITION_TABLE="gpt"
BOOTFS_TYPE="fat"

# Debug UART: mainline-style ttyS2 (fiq-debugger disabled in DTS)
SERIALCON="ttyS2"

# GPU: Mali-G52 via open Panfrost KMD + Mesa userspace (same stack as Rock 3A mainline/desktop).
# Mesa itself is installed by armbian-config module_desktops at DESKTOP_TIER=mid|full (default mid).
# Do NOT pass ENABLE_EXTENSIONS=mesa-vpu — that extension was removed upstream.

# Cinnamon: drop cinnamon-desktop-environment kitchen-sink (LibreOffice, Thunderbird, …).
enable_extension "cinnamon-slim"

# Mainline U-Boot for all branches (including vendor kernel).
# Maskrom rescue blob still under userpatches/overlay/z96a/uboot-prebuilt/ if this fails.
function post_family_config__z96a_use_mainline_uboot() {
	display_alert "${BOARD}" "mainline U-Boot v2026.04 + DDR v1.13 + RK817 DTS" "info"

	unset BOOTFS_TYPE
	declare -g BOOTCONFIG="rock-3a-rk3568_defconfig"
	declare -g BOOTDELAY=1
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
	declare -g BOOTBRANCH="tag:v2026.04"
	# Shared Armbian v2026.04 patches + empty board dir under userpatches
	declare -g BOOTPATCHDIR="v2026.04 v2026.04/board_${BOARD}"
	declare -g BOOTDIR="u-boot-${BOARD}"
	declare -g BOOT_SOC="rk3568"
	# Critical: jammy-proven DDR firmware (not family default v1.21)
	declare -g DDR_BLOB="rk35/rk3568_ddr_1560MHz_v1.13.bin"
	# Do NOT pack OP-TEE/BL32. Working Jammy FIT has ATF+U-Boot only (no tee).
	# Packing BL32 made kernel reach initramfs then hard-reset (secure DRAM).
	declare -g BOOTSCRIPT="boot-z96a.cmd:boot.cmd"

	# Binman: ATF + DDR TPL only (matches Jammy rescue FIT)
	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}
}

# Prefer eMMC only in U-Boot (empty SD / WiFi-SDIO probe prints -110).
function pre_config_uboot_target__z96a_boot_order() {
	declare -a rockchip_uboot_targets=("mmc0" "usb" "pxe" "dhcp")
	display_alert "${BOARD}" "U-Boot boot order: ${rockchip_uboot_targets[*]}" "info"
	if [[ -f include/configs/rockchip-common.h ]]; then
		sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${rockchip_uboot_targets[*]}\"/" include/configs/rockchip-common.h
	fi
}

# Create rk3568-z96a.dts from rock-3a with RK817 PMIC (both legacy and OF_UPSTREAM layouts).
function pre_config_uboot_target__z96a_make_uboot_dts() {
	local src="" dst="" mk=""
	if [[ -f arch/arm/dts/rk3568-rock-3a.dts ]]; then
		src="arch/arm/dts/rk3568-rock-3a.dts"
		dst="arch/arm/dts/rk3568-z96a.dts"
		mk="arch/arm/dts/Makefile"
	elif [[ -f dts/upstream/src/arm64/rockchip/rk3568-rock-3a.dts ]]; then
		src="dts/upstream/src/arm64/rockchip/rk3568-rock-3a.dts"
		dst="dts/upstream/src/arm64/rockchip/rk3568-z96a.dts"
		mk="dts/upstream/src/arm64/rockchip/Makefile"
	else
		exit_with_error "Missing Rock 3A U-Boot DTS (arch/arm/dts or dts/upstream)"
	fi

	display_alert "${BOARD}" "generating ${dst} (RK817) from rock-3a" "info"
	# Upstream rock-3a uses "radxa,rock3a" (no hyphen) and label rk809: — rename carefully.
	sed \
		-e 's/Radxa ROCK 3A/Z96A RK3568 Laptop/g' \
		-e 's/Radxa ROCK3 Model A/Z96A RK3568 Laptop/g' \
		-e 's/"radxa,rock3a"/"z96a,rk3568-laptop"/g' \
		-e 's/"radxa,rock-3a"/"z96a,rk3568-laptop"/g' \
		-e 's/compatible = "rockchip,rk809"/compatible = "rockchip,rk817"/g' \
		-e 's/\brk809:/rk817:/g' \
		-e 's/\&rk809\b/\&rk817/g' \
		"${src}" > "${dst}"

	# Z96A / RK817 tree uses vcc_1v8; rock-3a saradc points at vcca_1v8
	if grep -q 'vcca_1v8' "${dst}" && ! grep -q 'vcca_1v8:' "${dst}"; then
		sed -i 's/vref-supply = <\&vcca_1v8>/vref-supply = <\&vcc_1v8>/g' "${dst}"
	fi

	# OF_UPSTREAM auto-includes arch/arm/dts/<basename>-u-boot.dtsi (eMMC HS400 etc.)
	if [[ -f arch/arm/dts/rk3568-rock-3a-u-boot.dtsi ]]; then
		cp -f arch/arm/dts/rk3568-rock-3a-u-boot.dtsi arch/arm/dts/rk3568-z96a-u-boot.dtsi
		# Disable SD (empty) + SDIO WiFi in U-Boot only to avoid -110 probes.
		# Linux DTB still enables them for the running system.
		cat >> arch/arm/dts/rk3568-z96a-u-boot.dtsi <<'EOF'

/* Keep saradc enabled in U-Boot so we can print ADC (dnl never enters download). */

/* U-Boot boots from eMMC only; skip empty SD + WiFi SDIO probes */
&sdmmc0 {
	status = "disabled";
};

&sdmmc2 {
	status = "disabled";
};
EOF
	fi

	# OF_UPSTREAM builds DTB from the .dts path alone (no Makefile list required).
	# Legacy arch/arm/dts still needs a Makefile entry when used.
	if [[ -n "${mk}" && -f "${mk}" ]] && ! grep -q 'rk3568-z96a' "${mk}"; then
		if grep -q 'rk3568-rock-3a' "${mk}"; then
			sed -i 's/rk3568-rock-3a\.dtb/rk3568-rock-3a.dtb rk3568-z96a.dtb/' "${mk}"
		else
			echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3568-z96a.dtb' >> "${mk}"
		fi
	fi
}

# OF_UPSTREAM + binman FIT need matching DEFAULT_DEVICE_TREE / OF_LIST / SPL_OF_LIST.
function post_config_uboot_target__z96a_select_dtb() {
	local dt="rockchip/rk3568-z96a"
	display_alert "${BOARD}" "U-Boot DT/OF_LIST=${dt}" "info"
	for key in CONFIG_DEFAULT_DEVICE_TREE CONFIG_OF_LIST CONFIG_SPL_OF_LIST; do
		if grep -q "^${key}=" .config; then
			sed -i "s|^${key}=.*|${key}=\"${dt}\"|" .config
		else
			echo "${key}=\"${dt}\"" >> .config
		fi
	done
	if grep -q '^CONFIG_DEFAULT_FDT_FILE=' .config; then
		sed -i "s|^CONFIG_DEFAULT_FDT_FILE=.*|CONFIG_DEFAULT_FDT_FILE=\"${dt}.dtb\"|" .config
	fi

	# Skip EFI bootmgr (fails without ESP and probes empty MMC)
	for key in CONFIG_BOOTMETH_EFI_MGR CONFIG_EFI_BOOTMGR; do
		if grep -q "^${key}=y" .config; then
			sed -i "s|^${key}=y|# ${key} is not set|" .config
		fi
	done

	# Quiet Armbian 1001-fdt_fixup_ethernet-add-logs.patch spam
	if [[ -f boot/fdt_support.c ]]; then
		sed -i 's/log_info("\[fdt_fixup_ethernet\]/log_debug("[fdt_fixup_ethernet]/g' boot/fdt_support.c
	fi
	if [[ -f boot/image-fdt.c ]]; then
		sed -i 's/log_info("\[image_setup_libfdt\]/log_debug("[image_setup_libfdt]/g' boot/image-fdt.c
	fi

	# Enable interactive ADC read: adc list / adc single <dev> <channel>
	if grep -q '^# CONFIG_CMD_ADC is not set' .config; then
		sed -i 's|^# CONFIG_CMD_ADC is not set|CONFIG_CMD_ADC=y|' .config
	elif ! grep -q '^CONFIG_CMD_ADC=y' .config; then
		echo 'CONFIG_CMD_ADC=y' >> .config
	fi

	# Shut down again if PMIC ON_SOURCE was charger plug-in (not power key).
	# Without this, "poweroff then insert AC" always boots — laptop-unfriendly.
	if grep -q '^# CONFIG_ROCKCHIP_RK8XX_DISABLE_BOOT_ON_POWERON is not set' .config; then
		sed -i 's|^# CONFIG_ROCKCHIP_RK8XX_DISABLE_BOOT_ON_POWERON is not set|CONFIG_ROCKCHIP_RK8XX_DISABLE_BOOT_ON_POWERON=y|' .config
	elif ! grep -q '^CONFIG_ROCKCHIP_RK8XX_DISABLE_BOOT_ON_POWERON=y' .config; then
		echo 'CONFIG_ROCKCHIP_RK8XX_DISABLE_BOOT_ON_POWERON=y' >> .config
	fi
	display_alert "${BOARD}" "U-Boot: power off on charger plug-in (no auto-boot)" "info"

	# Do NOT enable CONFIG_ARMV8_SWITCH_TO_EL1: vendor kernel then reports
	# "CPUs started in inconsistent modes" (CPU0 EL1 vs secondaries EL2).
	# Stay in EL2 for all CPUs (matches working Jammy/ATF handoff).
	if grep -q '^CONFIG_ARMV8_SWITCH_TO_EL1=y' .config; then
		sed -i 's|^CONFIG_ARMV8_SWITCH_TO_EL1=y|# CONFIG_ARMV8_SWITCH_TO_EL1 is not set|' .config
		display_alert "${BOARD}" "disable ARMV8_SWITCH_TO_EL1 (consistent EL2 for SMP)" "info"
	fi

	# Boot path = Rock 3A / standard rk35xx bootflow:
	#   bootstd scans mmc0 → bootmeth script → FAT boot.scr (from BOOTSCRIPT=boot-z96a.cmd).
	# Do NOT replace CONFIG_BOOTCOMMAND / disable BOOTMETH_SCRIPT — that was only a
	# temporary rescue when eMMC had a broken boot.scr + OP-TEE. Production image
	# ships a correct boot.scr (load_addr=0x9000000, uInitrd required).
	# Keep EFI bootmgr off (above); leave BOOTSTD_* and BOOTMETH_SCRIPT as defconfig.
	display_alert "${BOARD}" "bootflow + boot.scr (boot-z96a.cmd), same pattern as Rock 3A" "info"

	# Never enter download mode via SARADC (Z96A: ch1=battery was misread as Loader key →
	# download loop; Maskrom return path also unsafe). Silent stub — ADC printf was debug-only.
	if [[ -f arch/arm/mach-rockchip/boot_mode.c ]]; then
		display_alert "${BOARD}" "disable download-key (silent stub)" "info"
		# Ensure setup_boot_mode still calls the check (so our hook runs).
		sed -i 's|^\t// z96a: rockchip_dnl_mode_check();$|\trockchip_dnl_mode_check();|' \
			arch/arm/mach-rockchip/boot_mode.c
		python3 - <<'PY'
from pathlib import Path
import re
p = Path("arch/arm/mach-rockchip/boot_mode.c")
t = p.read_text()
# Drop older z96a stubs (dnl_disabled / adc_debug with printf).
t = re.sub(
    r"\n/\* z96a_dnl_disabled: Z96A has no safe Maskrom return path.*?\n}\n?",
    "\n",
    t,
    count=1,
    flags=re.S,
)
# Replace any previous weak override (incl. ADC debug printf) with silent stub.
stub = """__weak int rockchip_dnl_key_pressed(void)
{
	return 0; /* z96a_dnl_off: never enter download mode */
}"""
t2, n = re.subn(
    r"__weak int rockchip_dnl_key_pressed\(void\)\s*\{.*?\n\}",
    lambda _m: stub,
    t,
    count=1,
    flags=re.S,
)
if n != 1:
    raise SystemExit(f"failed to patch rockchip_dnl_key_pressed (n={n})")
p.write_text(t2)
PY
	fi
}

function post_family_config__z96a_add_packages() {
	display_alert "${BOARD}" "adding base packages to image" "info"
	add_packages_to_image vim net-tools arping network-manager-openvpn-gnome

	if [[ "${BUILD_DESKTOP}" == "yes" ]]; then
		display_alert "${BOARD}" "ensuring Mesa / Panfrost userspace packages" "info"
		add_packages_to_image \
			libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libgbm1 \
			mesa-utils mesa-vulkan-drivers vulkan-tools

		# Same audio userspace as working GNOME images (Cinnamon mid still pulls
		# pulseaudio alone; without pipewire-pulse the sink helper never runs).
		add_packages_to_image pipewire pipewire-pulse wireplumber pipewire-audio \
			libspa-0.2-bluetooth pavucontrol

		if [[ "${DESKTOP_ENVIRONMENT}" == "gnome" ]]; then
			# Ubuntu-like GNOME: dock + desktop icons + Yaru (Armbian mid ships vanilla GNOME
			# and explicitly removes ubuntu-session). Keep this lean — not ubuntu-desktop-minimal.
			add_packages_to_image \
				gnome-shell-extension-prefs chrome-gnome-shell \
				ubuntu-session ubuntu-settings ubuntu-wallpapers \
				gnome-shell-extension-ubuntu-dock \
				gnome-shell-extension-desktop-icons-ng \
				yaru-theme-gtk yaru-theme-gnome-shell yaru-theme-icon yaru-theme-sound \
				fonts-ubuntu gnome-terminal software-properties-gtk \
				xdg-desktop-portal-gnome \
				gnome-calendar gnome-clocks gnome-characters evince
		fi

		if [[ "${RELEASE}" == "noble" || "${RELEASE}" == "jammy" ]]; then
			add_packages_to_image guvcview fcitx5 fcitx5-chinese-addons fcitx5-config-qt \
				fcitx5-frontend-gtk4 fcitx5-frontend-gtk3 fcitx5-frontend-gtk2 im-config zenity
		fi
	fi
}

# Make GNOME defaults closer to Ubuntu (dock left, Yaru, desktop icons, useful favorites).
function pre_customize_image__z96a_ubuntu_like_gnome() {
	[[ "${BUILD_DESKTOP}" == "yes" && "${DESKTOP_ENVIRONMENT}" == "gnome" ]] || return 0

	display_alert "${BOARD}" "apply Ubuntu-like GNOME dconf defaults" "info"

	local keys="/etc/dconf/db/local.d/01-z96a-ubuntu-gnome"
	local profile="/etc/dconf/profile/user"
	# Latest upstream Armbian (configng branding) ships exactly two desktop wallpapers:
	# light + dark Dre0x. Default matches gnome postinst: light for day, dark for dark mode.
	local wp_light="armbian18-Dre0x-Minum-light-3840x2160.jpg"
	local wp_dark="armbian03-Dre0x-Minum-dark-3840x2160.jpg"
	local wp_uri="file:///usr/share/backgrounds/armbian/${wp_light}"
	local wp_uri_dark="file:///usr/share/backgrounds/armbian/${wp_dark}"
	local wp_src="${SRC}/cache/sources/armbian-configng/tools/modules/desktops/branding/wallpapers"

	mkdir -p "${SDCARD}/usr/share/backgrounds/armbian" \
		"${SDCARD}/usr/share/gnome-background-properties"
	# Branding module normally installs these; stage from configng cache if missing.
	for f in "${wp_light}" "${wp_dark}"; do
		if [[ ! -f "${SDCARD}/usr/share/backgrounds/armbian/${f}" ]]; then
			if [[ ! -f "${wp_src}/${f}" ]]; then
				exit_with_error "${BOARD}" "missing upstream wallpaper ${f} (armbian-configng branding)"
			fi
			cp -f "${wp_src}/${f}" "${SDCARD}/usr/share/backgrounds/armbian/"
		fi
	done
	cat > "${SDCARD}/usr/share/gnome-background-properties/armbian.xml" <<- EOF
		<?xml version="1.0"?>
		<!DOCTYPE wallpapers SYSTEM "gnome-wp-list.dtd">
		<wallpapers>
		  <wallpaper deleted="false">
		    <name>Armbian light</name>
		    <filename>/usr/share/backgrounds/armbian/${wp_light}</filename>
		    <options>zoom</options>
		    <pcolor>#ffffff</pcolor>
		    <scolor>#000000</scolor>
		  </wallpaper>
		  <wallpaper deleted="false">
		    <name>Armbian dark</name>
		    <filename>/usr/share/backgrounds/armbian/${wp_dark}</filename>
		    <options>zoom</options>
		    <pcolor>#ffffff</pcolor>
		    <scolor>#000000</scolor>
		  </wallpaper>
		</wallpapers>
	EOF

	mkdir -p "${SDCARD}/etc/dconf/db/local.d" "${SDCARD}/etc/dconf/profile"
	cat > "${SDCARD}${keys}" <<- EOF
		[org/gnome/shell]
		enabled-extensions=['ubuntu-dock@ubuntu.com', 'ding@rastersoft.com', 'ubuntu-appindicators@ubuntu.com']
		favorite-apps=['org.gnome.Nautilus.desktop', 'chromium.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.TextEditor.desktop', 'org.gnome.Calculator.desktop']

		[org/gnome/shell/extensions/dash-to-dock]
		dock-position='LEFT'
		extend-height=true
		dash-max-icon-size=48
		show-trash=false
		show-mounts=true
		click-action='focus-or-previews'
		multi-monitor=true

		[org/gnome/desktop/interface]
		gtk-theme='Yaru'
		icon-theme='Yaru'
		cursor-theme='Yaru'
		color-scheme='default'
		font-name='Ubuntu 11'
		document-font-name='Ubuntu 11'
		monospace-font-name='Ubuntu Mono 13'

		[org/gnome/desktop/wm/preferences]
		button-layout='appmenu:minimize,maximize,close'

		# Settings → Date & Time → Automatic Time Zone (needs network + geoclue).
		[org/gnome/desktop/datetime]
		automatic-timezone=true

		[org/gnome/desktop/peripherals/touchpad]
		tap-to-click=true
		natural-scroll=true

		# Lid closed: blank display only (logind HandleLidSwitch=ignore).
		[org/gnome/settings-daemon/plugins/power]
		lid-close-ac-action='blank'
		lid-close-battery-action='blank'

		# Default terminal: gnome-terminal (Ctrl+Alt+T, Nautilus, desktop right-click).
		[org/gnome/desktop/default-applications/terminal]
		exec='gnome-terminal'
		exec-arg='--'

		[org/gnome/settings-daemon/plugins/media-keys]
		terminal=['<Primary><Alt>t']

		[org/gnome/shell/extensions/ding]
		terminal='gnome-terminal'

		[org/gnome/desktop/background]
		picture-uri='${wp_uri}'
		picture-uri-dark='${wp_uri_dark}'
		picture-options='zoom'
		primary-color='#456789'
		secondary-color='#FFFFFF'

		[org/gnome/desktop/screensaver]
		picture-uri='${wp_uri_dark}'
		picture-options='zoom'
		primary-color='#456789'
		secondary-color='#FFFFFF'
	EOF

	# Ensure user profile loads system-db (gnome postinst usually creates this).
	if [[ ! -f "${SDCARD}${profile}" ]] || ! grep -q 'system-db:local' "${SDCARD}${profile}" 2>/dev/null; then
		cat > "${SDCARD}${profile}" <<- EOF
			user-db:user
			system-db:local
		EOF
	fi

	# Drop stock 00-bg favorites (terminator/…) so first paint uses our 01-z96a keys only.
	# Wallpaper URIs above match upstream configng gnome postinst.
	rm -f "${SDCARD}/etc/dconf/db/local.d/00-bg"

	# gschema overrides apply before user dconf — dock/DING/theme ready at shell start.
	mkdir -p "${SDCARD}/usr/share/glib-2.0/schemas"
	cat > "${SDCARD}/usr/share/glib-2.0/schemas/90_z96a-ubuntu-gnome.gschema.override" <<- EOF
		[org.gnome.shell]
		enabled-extensions=['ubuntu-dock@ubuntu.com', 'ding@rastersoft.com', 'ubuntu-appindicators@ubuntu.com']
		favorite-apps=['org.gnome.Nautilus.desktop', 'chromium.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.TextEditor.desktop', 'org.gnome.Calculator.desktop']
		disable-user-extensions=false
		welcome-dialog-last-shown-version='99.0'

		[org.gnome.shell.extensions.dash-to-dock]
		dock-position='LEFT'
		extend-height=true
		dash-max-icon-size=48
		show-trash=false
		show-mounts=true
		click-action='focus-or-previews'
		multi-monitor=true

		[org.gnome.desktop.interface]
		gtk-theme='Yaru'
		icon-theme='Yaru'
		cursor-theme='Yaru'
		font-name='Ubuntu 11'
		document-font-name='Ubuntu 11'
		monospace-font-name='Ubuntu Mono 13'

		[org.gnome.desktop.wm.preferences]
		button-layout='appmenu:minimize,maximize,close'

		[org.gnome.desktop.datetime]
		automatic-timezone=true

		[org.gnome.desktop.background]
		picture-uri='${wp_uri}'
		picture-uri-dark='${wp_uri_dark}'
		picture-options='zoom'
		primary-color='#456789'
		secondary-color='#FFFFFF'

		[org.gnome.desktop.screensaver]
		picture-uri='${wp_uri_dark}'
		picture-options='zoom'
		primary-color='#456789'
		secondary-color='#FFFFFF'

		[org.gnome.desktop.default-applications.terminal]
		exec='gnome-terminal'
		exec-arg='--'
	EOF
	if [[ ! -f "${SDCARD}/usr/share/backgrounds/armbian/${wp_light}" ]]; then
		exit_with_error "${BOARD}" "default wallpaper not staged: ${wp_light}"
	fi
	chroot_sdcard glib-compile-schemas /usr/share/glib-2.0/schemas || true
	chroot_sdcard dconf update || true

	# Default session must be "ubuntu" (not plain "gnome") so dock/DING load with the
	# shell mode instead of enabling a few seconds after an empty desktop appears.
	mkdir -p "${SDCARD}/etc/skel/.config"
	cat > "${SDCARD}/etc/skel/.dmrc" <<- EOF
		[Desktop]
		Session=ubuntu
	EOF
	if [[ -d "${SDCARD}/etc/gdm3" ]]; then
		mkdir -p "${SDCARD}/etc/gdm3"
		if [[ -f "${SDCARD}/etc/gdm3/custom.conf" ]]; then
			sed -i 's/^#\?WaylandEnable=.*/WaylandEnable=false/' "${SDCARD}/etc/gdm3/custom.conf" || true
		fi
		# PreferredSession used by some gdm builds; harmless if ignored.
		grep -q '^\[daemon\]' "${SDCARD}/etc/gdm3/custom.conf" 2>/dev/null || \
			printf '%s\n' '[daemon]' >> "${SDCARD}/etc/gdm3/custom.conf"
		if grep -q '^#\?PreferredSession=' "${SDCARD}/etc/gdm3/custom.conf" 2>/dev/null; then
			sed -i 's/^#\?PreferredSession=.*/PreferredSession=ubuntu/' "${SDCARD}/etc/gdm3/custom.conf"
		else
			sed -i '/^\[daemon\]/a PreferredSession=ubuntu' "${SDCARD}/etc/gdm3/custom.conf"
		fi
	fi
	if [[ -f "${SDCARD}/etc/lightdm/lightdm.conf" ]]; then
		sed -i 's/^#\?user-session=.*/user-session=ubuntu/' "${SDCARD}/etc/lightdm/lightdm.conf" || true
	fi
	mkdir -p "${SDCARD}/etc/lightdm/lightdm.conf.d"
	cat > "${SDCARD}/etc/lightdm/lightdm.conf.d/90-z96a-ubuntu-session.conf" <<- EOF
		[Seat:*]
		user-session=ubuntu
	EOF

	# Skip first-login wizards that rewrite desktop/extensions after you land.
	mkdir -p "${SDCARD}/etc/xdg/autostart"
	for f in gnome-initial-setup-first-login.desktop gnome-welcome-tour.desktop; do
		if [[ -f "${SDCARD}/etc/xdg/autostart/${f}" ]]; then
			echo 'Hidden=true' >> "${SDCARD}/etc/xdg/autostart/${f}"
		fi
	done
	# Marker so initial-setup considers itself done for new users.
	touch "${SDCARD}/etc/skel/.config/gnome-initial-setup-done"

	# Quiet idle CPU: PackageKit + gnome-software auto-refresh hammer Cortex-A55.
	# Keep the apps installed; only stop background refresh / session autostart.
	for f in gnome-software-service.desktop org.gnome.Software.desktop; do
		if [[ -f "${SDCARD}/etc/xdg/autostart/${f}" ]]; then
			echo 'X-GNOME-Autostart-enabled=false' >> "${SDCARD}/etc/xdg/autostart/${f}"
			echo 'Hidden=true' >> "${SDCARD}/etc/xdg/autostart/${f}"
		fi
	done
	mkdir -p "${SDCARD}/etc/systemd/system"
	# packagekit.service is D-Bus activated; masking stops background refresh storms.
	chroot_sdcard systemctl mask packagekit.service packagekit-offline-update.service 2>/dev/null || true
	if [[ -f "${SDCARD}/etc/PackageKit/PackageKit.conf" ]]; then
		sed -i 's/^#\?GetUpdatesInterval=.*/GetUpdatesInterval=8640000/' "${SDCARD}/etc/PackageKit/PackageKit.conf" || true
	fi

	# xdg/x-terminal-emulator + new-user login shell -> bash via gnome-terminal.
	if [[ -x "${SDCARD}/usr/bin/gnome-terminal.wrapper" ]]; then
		chroot_sdcard update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator /usr/bin/gnome-terminal.wrapper 50 || true
		chroot_sdcard update-alternatives --set x-terminal-emulator /usr/bin/gnome-terminal.wrapper || true
	fi
	if [[ -f "${SDCARD}/etc/adduser.conf" ]]; then
		sed -i 's|^#\?DSHELL=.*|DSHELL=/bin/bash|' "${SDCARD}/etc/adduser.conf"
	fi
	if [[ -f "${SDCARD}/etc/default/useradd" ]]; then
		sed -i 's|^#\?SHELL=.*|SHELL=/bin/bash|' "${SDCARD}/etc/default/useradd"
	fi
}

# Cinnamon slim: enable_extension "cinnamon-slim" → pre_customize_image purge
# (userpatches/extensions/cinnamon-slim.sh). No lib/rootfs-create.sh hook.

function pre_customize_image__z96a_enbluetooth() {
	display_alert "${BOARD}" "install RTL8821CS bluetooth from userpatches/overlay" "info"

	local ov="${SRC}/userpatches/overlay/z96a"
	[[ -d "${ov}/bluetooth" ]] || exit_with_error "Missing Z96A bluetooth overlay" "${ov}/bluetooth"
	[[ -f "${ov}/bin/rtk_hciattach" ]] || exit_with_error "Missing rtk_hciattach" "${ov}/bin"

	add_packages_to_image rfkill bluetooth bluez bluez-tools

	mkdir -p "${SDCARD}/lib/firmware/rtl_bt"
	cp -fr "${ov}/bluetooth/rtl8821cs_config" "${SDCARD}/lib/firmware/rtl_bt/"
	cp -fr "${ov}/bluetooth/rtl8821cs_fw" "${SDCARD}/lib/firmware/rtl_bt/"

	install -Dm755 "${ov}/bin/bt_load_rtk_firmware" "${SDCARD}/usr/local/bin/bt_load_rtk_firmware"
	install -Dm755 "${ov}/bin/rtk_hciattach" "${SDCARD}/usr/local/bin/rtk_hciattach"
	install -Dm755 "${ov}/bin/z96a-bt-post" "${SDCARD}/usr/local/bin/z96a-bt-post"
	install -Dm755 "${ov}/bin/z96a-blueman-applet" "${SDCARD}/usr/local/bin/z96a-blueman-applet"
	install -Dm755 "${ov}/bin/z96a-blueman-manager" "${SDCARD}/usr/local/bin/z96a-blueman-manager"
	install -Dm755 "${ov}/bin/z96a-fix-blueman-activate" "${SDCARD}/usr/local/bin/z96a-fix-blueman-activate"
	# Tray click hang: ActivateAction("Activate") is invalid on blueman 2.3.x.
	chroot_sdcard /usr/local/bin/z96a-fix-blueman-activate || true
	install -Dm644 "${ov}/lib/systemd/system/z96a-bt-ready.service" \
		"${SDCARD}/lib/systemd/system/z96a-bt-ready.service"
	install -Dm644 "${ov}/lib/systemd/system/bluetooth.service.d/z96a-after-hci.conf" \
		"${SDCARD}/etc/systemd/system/bluetooth.service.d/z96a-after-hci.conf"
	# Cinnamon Blueman: stock applet; fast manager wrapper (kill hung single-instance).
	install -Dm644 "${ov}/etc/xdg/autostart/blueman.desktop" \
		"${SDCARD}/etc/xdg/autostart/blueman.desktop"
	install -Dm644 "${ov}/etc/dconf/db/local.d/02-z96a-blueman" \
		"${SDCARD}/etc/dconf/db/local.d/02-z96a-blueman"
	install -Dm644 "${ov}/share/dbus-1/services/org.blueman.Manager.service" \
		"${SDCARD}/usr/share/dbus-1/services/org.blueman.Manager.service"
	install -Dm644 "${ov}/etc/systemd/user/blueman-manager.service.d/override.conf" \
		"${SDCARD}/etc/systemd/user/blueman-manager.service.d/override.conf"
	if [[ -f "${SDCARD}/usr/share/applications/blueman-manager.desktop" ]]; then
		sed -i 's|^Exec=blueman-manager|Exec=/usr/local/bin/z96a-blueman-manager|' \
			"${SDCARD}/usr/share/applications/blueman-manager.desktop"
	fi
	mkdir -p "${SDCARD}/etc/dconf/profile"
	if [[ ! -f "${SDCARD}/etc/dconf/profile/user" ]] || ! grep -q 'system-db:local' "${SDCARD}/etc/dconf/profile/user" 2>/dev/null; then
		printf 'user-db:user\nsystem-db:local\n' > "${SDCARD}/etc/dconf/profile/user"
	fi
	chroot_sdcard dconf update || true

	for f in adbd adbservice io jtagactive jtaginquire arping-router; do
		[[ -f "${ov}/bin/${f}" ]] && install -Dm755 "${ov}/bin/${f}" "${SDCARD}/usr/local/bin/${f}"
	done

	for m in hci_uart rtw88_8821cs gpio_keys; do
		grep -qxF "$m" "${SDCARD}/etc/modules" 2>/dev/null || echo "$m" >> "${SDCARD}/etc/modules"
	done
	install -Dm644 "${ov}/etc/modules-load.d/z96a-gpio-keys.conf" \
		"${SDCARD}/etc/modules-load.d/z96a-gpio-keys.conf"

	# Lid hall → SW_LID: do NOT suspend. logind ignores lid; z96a-lid-blank
	# toggles backlight (GNOME "blank" is unreliable with HandleLidSwitch=ignore).
	mkdir -p "${SDCARD}/etc/systemd/logind.conf.d"
	cat > "${SDCARD}/etc/systemd/logind.conf.d/10-z96a-lid.conf" <<- EOD
		[Login]
		HandleLidSwitch=ignore
		HandleLidSwitchExternalPower=ignore
		HandleLidSwitchDocked=ignore
	EOD
	install -Dm755 "${ov}/bin/z96a-lid-blank" "${SDCARD}/usr/local/bin/z96a-lid-blank"
	install -Dm755 "${ov}/bin/z96a-lid-diag" "${SDCARD}/usr/local/bin/z96a-lid-diag"
	install -Dm644 "${ov}/lib/systemd/system/z96a-lid-blank.service" \
		"${SDCARD}/lib/systemd/system/z96a-lid-blank.service"
	install -Dm644 "${ov}/etc/default/z96a-lid-blank" \
		"${SDCARD}/etc/default/z96a-lid-blank"
	chroot_sdcard systemctl enable z96a-lid-blank.service

	# AutoEnable without duplicating [General] (append was breaking main.conf).
	if [[ -f "${SDCARD}/etc/bluetooth/main.conf" ]]; then
		if grep -qE '^#?AutoEnable=' "${SDCARD}/etc/bluetooth/main.conf"; then
			sed -i 's/^#\?AutoEnable=.*/AutoEnable=true/' "${SDCARD}/etc/bluetooth/main.conf"
		else
			sed -i '/^\[General\]/a AutoEnable=true' "${SDCARD}/etc/bluetooth/main.conf"
		fi
	fi

	# Indiedroid / rkwifibt: Type=simple + foreground rtk_hciattach.
	# z96a-bt-ready runs verified sequence: stop bluetooth → re-attach → wait hci0 → start → power on.
	cat > "${SDCARD}/etc/systemd/system/bluetooth-rtl8821cs.service" <<- EOD
		[Unit]
		Description=RTL8821CS Bluetooth (rtk_hciattach on UART1)
		After=local-fs.target sysinit.target dev-ttyS1.device
		Wants=dev-ttyS1.device
		Before=z96a-bt-ready.service

		[Service]
		Type=simple
		Environment=BT_TTY_DEV=/dev/ttyS1
		ExecStart=/usr/local/bin/bt_load_rtk_firmware
		Restart=on-failure
		RestartSec=5
		StandardOutput=journal
		StandardError=journal

		[Install]
		WantedBy=multi-user.target
	EOD
	chroot_sdcard systemctl enable bluetooth-rtl8821cs.service
	chroot_sdcard systemctl enable z96a-bt-ready.service
	# Do not let BlueZ race the UART attach at boot — that power-cycles rfkill
	# and wipes RTL8821CS firmware. z96a-bt-post starts bluetooth.service
	# only after hci0 exists (same sequence that worked when pasted by hand).
	chroot_sdcard systemctl disable bluetooth.service || true
}

function pre_customize_image__z96a_ensound() {
	display_alert "${BOARD}" "install z96a-ensound (find RK817 card, force SPK / amp GPIO)" "info"
	local ov="${SRC}/userpatches/overlay/z96a"
	local udir d

	install -Dm755 "${ov}/bin/z96a-ensound" "${SDCARD}/usr/local/bin/z96a-ensound"
	install -Dm755 "${ov}/bin/z96a-set-pipewire-sink" "${SDCARD}/usr/local/bin/z96a-set-pipewire-sink"
	install -Dm644 "${ov}/lib/systemd/user/z96a-set-pipewire-sink.service" \
		"${SDCARD}/usr/lib/systemd/user/z96a-set-pipewire-sink.service"
	install -Dm644 "${ov}/etc/wireplumber/main.lua.d/51-z96a-audio-priority.lua" \
		"${SDCARD}/etc/wireplumber/main.lua.d/51-z96a-audio-priority.lua"
	# Cinnamon may not start systemd --user wants from skel; XDG autostart is reliable.
	install -Dm644 "${ov}/etc/xdg/autostart/z96a-set-pipewire-sink.desktop" \
		"${SDCARD}/etc/xdg/autostart/z96a-set-pipewire-sink.desktop"
	# Prefer PipeWire over classic pulseaudio daemon (matches GNOME stack).
	chroot_sdcard systemctl --global enable z96a-set-pipewire-sink.service 2>/dev/null || true
	chroot_sdcard systemctl --global disable pulseaudio.socket pulseaudio.service 2>/dev/null || true
	chroot_sdcard systemctl --global mask pulseaudio.socket pulseaudio.service 2>/dev/null || true

	# Placeholder; z96a-ensound rewrites with the real card index at boot.
	cat > "${SDCARD}/etc/asound.conf" <<- EOD
		pcm.!default {
			type plug
			slave.pcm "qhw"
		}
		pcm.qhw {
			type hw
			card 1
		}
		ctl.!default {
			type hw
			card 1
		}
	EOD

	cat > "${SDCARD}/etc/systemd/system/amixer_enspk1.service" <<- EOD
		[Unit]
		Description=Z96A enable speaker path (RK817 Playback Path=SPK, amp GPIO)
		After=sound.target multi-user.target
		Wants=sound.target

		[Service]
		Type=oneshot
		ExecStart=/usr/local/bin/z96a-ensound
		RemainAfterExit=true
		# Script waits for cards + re-applies ~90s against headset/PipeWire races
		TimeoutStartSec=150
		StandardOutput=journal
		StandardError=journal

		[Install]
		WantedBy=multi-user.target
	EOD
	chroot_sdcard systemctl enable amixer_enspk1.service

	# Desktop apps (browser/video) use PipeWire, not raw ALSA like speaker-test.
	for d in "${SDCARD}/etc/skel" "${SDCARD}"/home/*; do
		[[ -d "${d}" ]] || continue
		udir="${d}/.config/systemd/user/default.target.wants"
		mkdir -p "${udir}"
		ln -sf /usr/lib/systemd/user/z96a-set-pipewire-sink.service \
			"${udir}/z96a-set-pipewire-sink.service"
	done
}

function pre_customize_image__z96a_not_powersaving() {
	echo 'alias ls="ls --color=auto"' >> "${SDCARD}/etc/bash.bashrc"

	if [[ "${BUILD_DESKTOP}" == "yes" && "${DESKTOP_ENVIRONMENT}" == "gnome" ]]; then
		display_alert "${BOARD}" "setup wifi keep-alive arping" "info"
		echo '15 * * * * root /usr/local/bin/arping-router' >> "${SDCARD}/etc/crontab"
	fi
	return 0
}

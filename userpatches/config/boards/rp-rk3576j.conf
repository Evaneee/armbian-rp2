# Rockchip RK3576 SoC octa core 4-16GB RAM SoC 2xGbE UFS USB3 WIFI NvME
BOARD_NAME="rp-rk3576j"
BOOT_SOC="rk3576"
BOARD_VENDOR="rongpin"
BOARDFAMILY="rk35xx"
LINUXCONFIG="linux-rk35xx-vendor-rp-3576j"
BOOTCONFIG="rp-3576j_defconfig"
# BOOTCONFIG="nanopi-m5-rk3576_defconfig"
# WIP: current kernel (no comments on same line as KERNEL_TARGET)
KERNEL_TARGET="vendor,edge"
FULL_DESKTOP="yes"
ASOUND_STATE="asound.state.nanopi-m5"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rp-rk3576.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="yes"
BOOT_SPI_RKSPI_LOADER="yes"
DDR_BLOB="rk35/rk3576_ddr_lp4_1800MHz_lp5_2400MHz_v1.09.bin"
IMAGE_PARTITION_TABLE="gpt"
BOARD_MAINTAINER="Evan"


function post_family_tweaks__nanopi-m5_naming_audios() {
	display_alert "$BOARD" "Renaming NanoPi M5 audio" "info"

	mkdir -p $SDCARD/etc/udev/rules.d/
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi-sound", ENV{SOUND_DESCRIPTION}="HDMI Audio"' > $SDCARD/etc/udev/rules.d/90-naming-audios.rules
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-rt5616-sound", ENV{SOUND_DESCRIPTION}="RT5616 Audio"' >> $SDCARD/etc/udev/rules.d/90-naming-audios.rules
	return 0
}

function pre_config_uboot_target__100_copy_userpatches_rk3576_ddr_blob() {
	[[ "${BOOT_SOC}" != "rk3576" ]] && return 0

	local blob_rel_path="${DDR_BLOB}"
	local blob_name="${blob_rel_path##*/}"
	local src_blob="${SRC}/userpatches/overlay/${blob_name}"
	local dst_blob="${RKBIN_DIR}/${blob_rel_path}"

	display_alert "$BOARD" "正在copy ${blob_name}" "info"

	[[ ! -f "${src_blob}" ]] && exit_with_error "Missing custom DDR blob" "${src_blob}"

	mkdir -p "$(dirname "${dst_blob}")"
	run_host_command_logged cp -fv "${src_blob}" "${dst_blob}"
}

function post_family_tweaks__rp_rk3576j_install_usbdevice() {
	display_alert "$BOARD" "Installing usbdevice gadget script" "info"

	local adbd_src="${SRC}/userpatches/overlay/adbd"
	local usbdevice_src="${SRC}/userpatches/overlay/usbdevice"
	local usbdevice_service_src="${SRC}/userpatches/overlay/usbdevice.service"
	local usbdevice_postfirstlogin_src="${SRC}/userpatches/overlay/usbdevice-postfirstlogin.sh"
	local usbdevice_postfirstlogin_service_src="${SRC}/userpatches/overlay/usbdevice-postfirstlogin.service"

	[[ ! -f "${adbd_src}" ]] && exit_with_error "Missing adbd binary" "${adbd_src}"
	[[ ! -f "${usbdevice_src}" ]] && exit_with_error "Missing usbdevice script" "${usbdevice_src}"
	[[ ! -f "${usbdevice_service_src}" ]] && exit_with_error "Missing usbdevice service" "${usbdevice_service_src}"
	[[ ! -f "${usbdevice_postfirstlogin_src}" ]] && exit_with_error "Missing usbdevice post-firstlogin script" "${usbdevice_postfirstlogin_src}"
	[[ ! -f "${usbdevice_postfirstlogin_service_src}" ]] && exit_with_error "Missing usbdevice post-firstlogin service" "${usbdevice_postfirstlogin_service_src}"

	install -Dm755 "${adbd_src}" "${SDCARD}/usr/bin/adbd"
	install -Dm755 "${usbdevice_src}" "${SDCARD}/usr/bin/usbdevice"
	install -Dm644 "${usbdevice_service_src}" "${SDCARD}/usr/lib/systemd/system/usbdevice.service"
	install -Dm755 "${usbdevice_postfirstlogin_src}" "${SDCARD}/usr/lib/rp-rk3576j/usbdevice-postfirstlogin.sh"
	install -Dm644 "${usbdevice_postfirstlogin_service_src}" "${SDCARD}/usr/lib/systemd/system/usbdevice-postfirstlogin.service"

	mkdir -p "${SDCARD}/etc/usbdevice.d"
	echo 'USB_FUNCS=adb' > "${SDCARD}/etc/usbdevice.d/adb.sh"

	mkdir -p "${SDCARD}/etc/systemd/system/multi-user.target.wants"
	ln -sf /usr/lib/systemd/system/usbdevice-postfirstlogin.service \
		"${SDCARD}/etc/systemd/system/multi-user.target.wants/usbdevice-postfirstlogin.service"

	return 0
}

